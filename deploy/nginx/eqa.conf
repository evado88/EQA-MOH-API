# EQA platform — nginx site (Ubuntu 24, primary config)
#
# Single domain: the React SPA is served at / and the FastAPI backend is
# proxied under /api/ on the SAME host, so there is one certificate, one DNS
# record, and no CORS (same origin).
#
# Place at /etc/nginx/sites-available/eqa and symlink into sites-enabled.
# This is a plain HTTP (port 80) block; `certbot --nginx` upgrades it to HTTPS
# (adds the 443 block + the http->https redirect) and sets up auto-renewal.
# Make sure the DNS A record for eqa.ims-zm.online points here BEFORE certbot.

server {
    listen 80;
    listen [::]:80;
    server_name eqa.ims-zm.online;

    root /var/www/eqa/dist;
    index index.html;

    # result-file attachments (Excel, etc.) — raise from nginx's 1m default
    client_max_body_size 25m;

    # --- API: FastAPI/uvicorn on 127.0.0.1:8800 (strip the /api prefix) ---
    # the trailing slash on proxy_pass rewrites /api/auth/login -> /auth/login
    location /api/ {
        proxy_pass http://127.0.0.1:8800/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- uploaded files served by the backend (keep the /static prefix) ---
    location /static/ {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- content-hashed build assets: cache hard ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- single-page app: unknown paths fall back to index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
